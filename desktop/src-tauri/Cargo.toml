[package]
name = "drawing-workbench"
version = "0.1.0"
description = "ECG Source List (hello-world proof of concept)"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Matthew Kelly"]
repository = "https://github.com/matkeng/fastengineer"

[lib]
name = "drawing_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
