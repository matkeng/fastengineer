name: Checks

# Quick checks on every push: lint, the Python tests, the front-end type-check and build, and
# the help pages. A few minutes on Linux. The Windows installer build stays manual
# (windows-build.yml).
on:
  push:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            desktop/engine/pyproject.toml

      - name: Install
        run: python -m pip install ruff -e core -e "desktop/engine[test]"

      - name: Lint
        run: ruff check

      - name: Tests
        run: python -m pytest -q core/tests desktop/engine/tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Type-check, build and unit tests
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - name: Help pages
        run: node scripts/check-help.cjs
