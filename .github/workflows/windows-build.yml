name: Drawing Workbench - Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawing-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('core/**/*.py', 'desktop/engine/**/*.py', 'desktop/engine/pyproject.toml') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Build sidecar, front end and installers
        run: ./scripts/build-windows.ps1

      - name: Python tests
        run: |
          .venv\Scripts\python -m pip install -e "desktop/engine[test]"
          .venv\Scripts\python -m pytest -q core/tests desktop/engine/tests

      - name: Make sure Windows OCR (en-US) is installed
        # Desktop Windows has it; server images may not. The smoke test reports if it stays missing.
        continue-on-error: true
        run: |
          $cap = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US*' | Select-Object -First 1
          "OCR capability: $($cap.Name) is $($cap.State)"
          if ($cap -and $cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null; "Installed $($cap.Name)" }

      - name: Smoke-test the compiled engine
        run: |
          $exe = Get-ChildItem desktop/src-tauri/binaries/workbench-engine-*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--port','8799','--data-dir',(Join-Path $env:RUNNER_TEMP 'wbdata') -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              try { $info = Invoke-RestMethod http://127.0.0.1:8799/api/info; $ok = $true } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw 'engine did not start' }
            $info | Format-List
            if (-not $info.compiled) { throw 'engine is not Nuitka-compiled' }
            (Invoke-RestMethod 'http://127.0.0.1:8799/api/hello?name=CI').message

            # Excel query flow against the compiled binary (checks openpyxl was bundled).
            $base = 'http://127.0.0.1:8799/api/excel/workbooks'
            $wb = Invoke-RestMethod -Method Post -Uri "$base`?filename=cable-schedule-sample.xlsx" `
              -InFile samples/cable-schedule-sample.xlsx -ContentType 'application/octet-stream'
            $src = [uri]::EscapeDataString($wb.sources[0].id)
            $pv = Invoke-RestMethod "$base/$($wb.id)/preview?source=$src"
            $cols = Invoke-RestMethod "$base/$($wb.id)/columns?source=$src&header_row=$($pv.suggested_header_row)&header_rows=$($pv.suggested_header_rows)"
            $body = @{ source = $wb.sources[0].id; header_row = $pv.suggested_header_row;
                       header_rows = $pv.suggested_header_rows; key_column = $cols.suggested_key } | ConvertTo-Json
            $ex = Invoke-RestMethod -Method Post -Uri "$base/$($wb.id)/extract" -Body $body -ContentType 'application/json'
            "Extracted $($ex.rows.Count) rows; duplicate keys: $($ex.duplicate_keys -join ', ')"
            if ($ex.rows.Count -ne 13) { throw "expected 13 rows, got $($ex.rows.Count)" }
            if (-not ($ex.rows | Where-Object { $_.strike -eq 'partial' })) { throw 'no partial strikes detected' }

            # Compare Rev C with Rev D.
            $wbD = Invoke-RestMethod -Method Post -Uri "$base`?filename=cable-schedule-sample-revD.xlsx" `
              -InFile samples/cable-schedule-sample-revD.xlsx -ContentType 'application/octet-stream'
            $side = @{ source = 'sheet:Cable Schedule'; header_row = 4; header_rows = 2; key_column = 0 }
            $cmpBody = @{ a = $side + @{ workbook_id = $wb.id }; b = $side + @{ workbook_id = $wbD.id } } | ConvertTo-Json -Depth 4
            $cmp = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8799/api/excel/compare' -Body $cmpBody -ContentType 'application/json'
            $cmp.summary | Format-List
            $s = $cmp.summary
            if ("$($s.added),$($s.deleted),$($s.struck),$($s.restored),$($s.changed)" -ne '1,1,1,1,4') { throw 'unexpected compare summary' }

            # Export to .xlsx at a path (what the desktop Save As dialog does).
            $out = Join-Path $env:RUNNER_TEMP 'compare-export.xlsx'
            $expBody = @{ a = $side + @{ workbook_id = $wb.id }; b = $side + @{ workbook_id = $wbD.id }; path = $out } | ConvertTo-Json -Depth 4
            $saved = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8799/api/excel/compare/export' -Body $expBody -ContentType 'application/json'
            if (-not (Test-Path $saved.path) -or (Get-Item $saved.path).Length -lt 2000) { throw 'xlsx export not written' }
            "Exported $($saved.path) ($((Get-Item $saved.path).Length) bytes)"

            # MEL import: recipe + CSV revision + a calculated column (asteval) + load list.
            $mel = 'http://127.0.0.1:8799/api/mel'
            $r = Invoke-RestMethod -Method Post -Uri "$mel/recipes" -Body (@{ name = 'CI MEL'; target = 'MEL' } | ConvertTo-Json) -ContentType 'application/json'
            $null = Invoke-RestMethod -Method Post -Uri "$mel/recipes/$($r.id)/revisions/csv?filename=mel-sample.csv&key=Equipment%20Tag" `
              -InFile samples/mel-sample.csv -ContentType 'application/octet-stream'
            $r.auto_columns = @(@{ name = 'kW'; statement = "<<Motor HP>> != ''"; true_val = 'round(<<Motor HP>> * 0.746, 1)'; false_val = '0'; error_val = '?' })
            $r.mapping = @(@{ field = 'tag'; column = 'Equipment Tag' }, @{ field = 'load_rating'; column = 'kW' })
            $null = Invoke-RestMethod -Method Put -Uri "$mel/recipes/$($r.id)" -Body ($r | ConvertTo-Json -Depth 6) -ContentType 'application/json'
            $ll = Invoke-RestMethod -Method Post -Uri "$mel/recipes/$($r.id)/loadlist" -Body '{}' -ContentType 'application/json'
            $p101 = $ll.rows | Where-Object { $_.tag -eq 'P-101' }
            "MEL load list: $($ll.rows.Count) rows; P-101 load_rating = $($p101.load_rating)"
            if ($p101.load_rating -ne 29.8) { throw 'calculated column wrong in the compiled engine' }
            "Data stored at $((Invoke-RestMethod "$mel/storage").path)"

            # Lists & tables: a list, a typed table, a row (validated and coerced by the compiled engine).
            $ref = 'http://127.0.0.1:8799/api/ref'
            $en = Invoke-RestMethod -Method Post -Uri "$ref/enums" -Body '{"name":"Voltage"}' -ContentType 'application/json'
            $en = Invoke-RestMethod -Method Put -Uri "$ref/enums/$($en.id)" -ContentType 'application/json' `
              -Body (@{ name = 'Voltage'; items = @(@{ code = 'LV'; value = '400 V' }) } | ConvertTo-Json -Depth 4)
            $tb = Invoke-RestMethod -Method Post -Uri "$ref/tables" -Body '{"name":"Motors"}' -ContentType 'application/json'
            $cols = @(@{ name = 'Tag'; type = 'text'; required = $true; unique = $true }, @{ name = 'kW'; type = 'decimal' },
                      @{ name = 'Voltage'; type = 'enum'; enum_id = $en.id })
            $td = Invoke-RestMethod -Method Put -Uri "$ref/tables/$($tb.id)" -ContentType 'application/json' `
              -Body (@{ name = 'Motors'; columns = $cols } | ConvertTo-Json -Depth 4)
            $c = $td.table.columns
            $vals = @{}; $vals[$c[0].id] = 'P-101'; $vals[$c[1].id] = '30.50'; $vals[$c[2].id] = 'LV'
            $row = Invoke-RestMethod -Method Post -Uri "$ref/tables/$($tb.id)/rows" -ContentType 'application/json' `
              -Body (@{ values = $vals } | ConvertTo-Json -Depth 4)
            "Ref row: kW = $($row.values.($c[1].id)); voltage item = $($row.values.($c[2].id))"
            if ($row.values.($c[1].id) -ne '30.5' -or $row.values.($c[2].id) -ne $en.items[0].id) { throw 'ref row not coerced' }

            # P&ID analysis: PyMuPDF render, OpenCV matching and tag reading in the compiled engine.
            $pidApi = 'http://127.0.0.1:8799/api/pid'
            function Wait-Job2($url) {
              for ($i = 0; $i -lt 480; $i++) {
                $o = Invoke-RestMethod $url
                if ($o.status -notin @('rendering', 'queued', 'running')) { return $o }
                Start-Sleep -Milliseconds 500
              }
              throw "timed out waiting for $url"
            }
            $null = Invoke-RestMethod -Method Post -Uri "$pidApi/templates/import" -ContentType 'application/json' `
              -Body (Get-Content samples/pid-templates.json -Raw)
            $dw = Invoke-RestMethod -Method Post -Uri "$pidApi/drawings?filename=pid-sample.pdf" `
              -InFile samples/pid-sample.pdf -ContentType 'application/octet-stream'
            $dw = Wait-Job2 "$pidApi/drawings/$($dw.id)"
            if ($dw.status -ne 'ready') { throw "P&ID render failed: $($dw.error)" }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $run = Invoke-RestMethod -Method Post -Uri "$pidApi/runs" -Body (@{ doc_ids = @($dw.id) } | ConvertTo-Json) -ContentType 'application/json'
            $run = Wait-Job2 "$pidApi/runs/$($run.id)"
            $tags = Invoke-RestMethod "$pidApi/runs/$($run.id)/tags"
            "P&ID: $($run.tag_count) tags from $($dw.pages.Count) sheets in $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s: $(($tags.rows | ForEach-Object { $_.Tag }) -join ', ')"
            if ($run.status -ne 'done' -or $run.tag_count -ne 11 -or -not ($tags.rows | Where-Object { $_.Tag -eq 'FT-1023' })) {
              throw "P&ID tags wrong in the compiled engine: $($run | ConvertTo-Json -Depth 3)"
            }

            # Scanned (image-only) sample: Windows OCR reads the text.
            $ocr = Invoke-RestMethod "$pidApi/ocr"
            "OCR: available=$($ocr.available) engine=$($ocr.engine) reason=$($ocr.reason)"
            $sc = Invoke-RestMethod -Method Post -Uri "$pidApi/drawings?filename=pid-sample-scanned.pdf" `
              -InFile samples/pid-sample-scanned.pdf -ContentType 'application/octet-stream'
            $sc = Wait-Job2 "$pidApi/drawings/$($sc.id)"
            $sw.Restart()
            $runS = Invoke-RestMethod -Method Post -Uri "$pidApi/runs" -Body (@{ doc_ids = @($sc.id) } | ConvertTo-Json) -ContentType 'application/json'
            $runS = Wait-Job2 "$pidApi/runs/$($runS.id)"
            $tagsS = if ($runS.tag_count) { (Invoke-RestMethod "$pidApi/runs/$($runS.id)/tags").rows | ForEach-Object { $_.Tag } } else { @() }
            "Scanned sample with OCR: $($runS.tag_count) tags in $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s: $($tagsS -join ', ')"
            $runS.warnings | Select-Object -First 5 | ForEach-Object { "  warning: $_" }
            if ($ocr.available) {
              if ($runS.tag_count -lt 1) { throw 'Windows OCR found no tags on the scanned sample' }
            } else {
              Write-Host "::warning::Windows OCR is not available on this runner ($($ocr.reason)); the scanned-sample check was skipped."
            }

            # The tags list into an instrument-list import (target PIL).
            $pil = Invoke-RestMethod -Method Post -Uri "$mel/recipes" -Body (@{ name = 'CI instruments'; target = 'PIL' } | ConvertTo-Json) -ContentType 'application/json'
            $null = Invoke-RestMethod -Method Post -Uri "$mel/recipes/$($pil.id)/revisions/pid" -Body (@{ run_id = $run.id } | ConvertTo-Json) -ContentType 'application/json'
            $pil.mapping = @(@{ field = 'tag'; column = 'Tag' }, @{ field = 'loop'; column = 'Loop' })
            $null = Invoke-RestMethod -Method Put -Uri "$mel/recipes/$($pil.id)" -Body ($pil | ConvertTo-Json -Depth 6) -ContentType 'application/json'
            $il = Invoke-RestMethod -Method Post -Uri "$mel/recipes/$($pil.id)/loadlist" -Body '{}' -ContentType 'application/json'
            "Instrument list: $($il.rows.Count) rows; fields $($il.fields -join ', ')"
            if ($il.rows.Count -ne 11) { throw 'instrument list wrong' }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Smoke-test the portable app
        run: |
          $dir = Get-ChildItem dist -Directory -Filter '*-portable-x64' | Select-Object -First 1
          $app = Start-Process (Join-Path $dir.FullName 'Drawing Workbench.exe') -PassThru
          try {
            # The shell should find workbench-engine.exe beside it and start it.
            $engine = $null
            for ($i = 0; $i -lt 60 -and -not $engine; $i++) {
              Start-Sleep -Milliseconds 500
              if ($app.HasExited) { throw "app exited early with code $($app.ExitCode)" }
              $engine = Get-Process workbench-engine -ErrorAction SilentlyContinue
            }
            if (-not $engine) { throw 'portable app did not start its engine' }
            "Portable app running (pid $($app.Id)); engine pid(s): $($engine.Id -join ', ')"
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          # The engine watches the app's PID and must exit by itself, even when the app is
          # killed while the engine is still starting (its watchdog starts with Python).
          $t = [Diagnostics.Stopwatch]::StartNew()
          do {
            Start-Sleep -Milliseconds 500
            $left = Get-Process workbench-engine -ErrorAction SilentlyContinue
          } while ($left -and $t.Elapsed.TotalSeconds -lt 60)
          if ($left) {
            $left | Stop-Process -Force
            throw "engine still running $([int]$t.Elapsed.TotalSeconds)s after the app was killed: $($left.Id -join ', ')"
          }
          "Engine exited $([math]::Round($t.Elapsed.TotalSeconds, 1))s after the app was killed."

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: drawing-workbench-portable
          path: dist/Drawing-Workbench-*-portable-x64/
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: drawing-workbench-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
