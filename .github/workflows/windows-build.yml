name: Drawing Workbench - Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawing-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('core/**/*.py', 'desktop/engine/**/*.py', 'desktop/engine/pyproject.toml') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Build sidecar, front end and installers
        run: ./scripts/build-windows.ps1

      - name: Python tests
        run: |
          .venv\Scripts\python -m pip install -e "desktop/engine[test]"
          .venv\Scripts\python -m pytest -q core/tests desktop/engine/tests

      - name: Smoke-test the compiled engine
        run: |
          $exe = Get-ChildItem desktop/src-tauri/binaries/workbench-engine-*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--port','8799' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              try { $info = Invoke-RestMethod http://127.0.0.1:8799/api/info; $ok = $true } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw 'engine did not start' }
            $info | Format-List
            if (-not $info.compiled) { throw 'engine is not Nuitka-compiled' }
            (Invoke-RestMethod 'http://127.0.0.1:8799/api/hello?name=CI').message

            # Excel query flow against the compiled binary (checks openpyxl was bundled).
            $base = 'http://127.0.0.1:8799/api/excel/workbooks'
            $wb = Invoke-RestMethod -Method Post -Uri "$base`?filename=cable-schedule-sample.xlsx" `
              -InFile samples/cable-schedule-sample.xlsx -ContentType 'application/octet-stream'
            $src = [uri]::EscapeDataString($wb.sources[0].id)
            $pv = Invoke-RestMethod "$base/$($wb.id)/preview?source=$src"
            $cols = Invoke-RestMethod "$base/$($wb.id)/columns?source=$src&header_row=$($pv.suggested_header_row)&header_rows=$($pv.suggested_header_rows)"
            $body = @{ source = $wb.sources[0].id; header_row = $pv.suggested_header_row;
                       header_rows = $pv.suggested_header_rows; key_column = $cols.suggested_key } | ConvertTo-Json
            $ex = Invoke-RestMethod -Method Post -Uri "$base/$($wb.id)/extract" -Body $body -ContentType 'application/json'
            "Extracted $($ex.rows.Count) rows; duplicate keys: $($ex.duplicate_keys -join ', ')"
            if ($ex.rows.Count -ne 13) { throw "expected 13 rows, got $($ex.rows.Count)" }
            if (-not ($ex.rows | Where-Object { $_.strike -eq 'partial' })) { throw 'no partial strikes detected' }

            # Compare Rev C with Rev D.
            $wbD = Invoke-RestMethod -Method Post -Uri "$base`?filename=cable-schedule-sample-revD.xlsx" `
              -InFile samples/cable-schedule-sample-revD.xlsx -ContentType 'application/octet-stream'
            $side = @{ source = 'sheet:Cable Schedule'; header_row = 4; header_rows = 2; key_column = 0 }
            $cmpBody = @{ a = $side + @{ workbook_id = $wb.id }; b = $side + @{ workbook_id = $wbD.id } } | ConvertTo-Json -Depth 4
            $cmp = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8799/api/excel/compare' -Body $cmpBody -ContentType 'application/json'
            $cmp.summary | Format-List
            $s = $cmp.summary
            if ("$($s.added),$($s.deleted),$($s.struck),$($s.restored),$($s.changed)" -ne '1,1,1,1,4') { throw 'unexpected compare summary' }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Smoke-test the portable app
        run: |
          $dir = Get-ChildItem dist -Directory -Filter '*-portable-x64' | Select-Object -First 1
          $app = Start-Process (Join-Path $dir.FullName 'Drawing Workbench.exe') -PassThru
          try {
            # The shell should find workbench-engine.exe beside it and start it.
            $engine = $null
            for ($i = 0; $i -lt 60 -and -not $engine; $i++) {
              Start-Sleep -Milliseconds 500
              if ($app.HasExited) { throw "app exited early with code $($app.ExitCode)" }
              $engine = Get-Process workbench-engine -ErrorAction SilentlyContinue
            }
            if (-not $engine) { throw 'portable app did not start its engine' }
            "Portable app running (pid $($app.Id)); engine pid(s): $($engine.Id -join ', ')"
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            # The engine watches the app's PID and should exit by itself.
            $left = Get-Process workbench-engine -ErrorAction SilentlyContinue
            if ($left) { "Warning: engine still running after app exit: $($left.Id -join ', ')"; $left | Stop-Process -Force }
            else { 'Engine exited with the app.' }
          }

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: drawing-workbench-portable
          path: dist/Drawing-Workbench-*-portable-x64/
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: drawing-workbench-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
