[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-core"
version = "0.1.0"
description = "Drawing Workbench core engine (framework-free: no Django or FastAPI imports)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openpyxl>=3.1.3",
    "asteval>=1.0",
    # P&ID analysis
    "pymupdf>=1.26,<2",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
    # Windows built-in OCR for scanned P&IDs (nothing to bundle; Windows provides the engine)
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]
