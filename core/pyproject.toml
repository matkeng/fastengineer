[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-core"
version = "0.1.0"
description = "Drawing Workbench core engine (framework-free: no Django or FastAPI imports)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "openpyxl>=3.1.3", "asteval>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
